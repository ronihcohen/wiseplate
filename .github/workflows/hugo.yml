# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (and the other IndexNow engines; Google does not use it) which
  # pages this push added or changed, so they are recrawled without waiting
  # for the sitemap. The key is public by design: it is served from
  # static/<key>.txt to prove the site owns it.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    continue-on-error: true
    env:
      INDEXNOW_KEY: 80f5d65ad7594957e2cde9ed787264e6
      SITE: https://wiseplate.blog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed URLs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: python
        run: |
          import json, os, re, subprocess, urllib.request
          before, after = os.environ["BEFORE"], os.environ["AFTER"]
          if not before or set(before) == {"0"}:
              raise SystemExit("No previous commit to diff against")
          files = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=AMR", before, after, "--", "content"],
              capture_output=True, text=True, check=True).stdout.split()
          site = os.environ["SITE"]
          urls = []
          for f in files:
              m = re.fullmatch(r"content/(.*?)(?:\.(en))?\.md", f)
              if not m:
                  continue
              path, lang = m.groups()
              path = re.sub(r"(^|/)_index$", "", path)
              url = site + ("/en" if lang else "") + "/" + (path + "/" if path else "")
              urls.append(url)
          if not urls:
              raise SystemExit("No content changes")
          body = json.dumps({
              "host": site.split("//")[1],
              "key": os.environ["INDEXNOW_KEY"],
              "keyLocation": f"{site}/{os.environ['INDEXNOW_KEY']}.txt",
              "urlList": sorted(set(urls))[:10000],
          }).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", body,
                                       {"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req) as r:
              print(r.status, len(urls), "URLs submitted")