<div class="site-search" role="search" aria-label="{{ T "searchLabel" }}" data-loading="{{ T "searchLoading" }}" data-found="{{ T "searchFound" }}" data-none="{{ T "searchNone" }}" data-error="{{ T "searchError" }}" data-search-index="{{ (.Site.Home.OutputFormats.Get "JSON").RelPermalink }}" hidden>
  <label class="sr-only" for="site-search-input">{{ T "searchLabel" }}</label>
  <input id="site-search-input" type="search" placeholder="{{ T "searchPlaceholder" }}" autocomplete="off"
         role="combobox" aria-autocomplete="list" aria-expanded="false"
         aria-controls="site-search-results" aria-describedby="site-search-status">
  <div class="search-panel" hidden>
    <ul id="site-search-results" role="listbox" aria-label="{{ T "searchSuggestions" }}"></ul>
    <p id="site-search-status" role="status" aria-live="polite"></p>
  </div>
</div>
<script src="{{ "js/search.js" | relURL }}" defer></script>
