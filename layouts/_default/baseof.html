<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ site.Language.LanguageDirection }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a href="#main-content" class="skip-link">{{ T "skipToContent" }}</a>
  {{ partial "nav.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
