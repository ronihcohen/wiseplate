baseURL = 'https://wiseplate.blog/'
# Hebrew is the site; English holds translations of individual articles only.
# Hebrew stays at the root so no existing URL moves, and English lives under
# /en/. A page is translated by adding a sibling file with an .en.md suffix
# (content/food/kefir.md -> content/food/kefir.en.md); see CLAUDE.md.
defaultContentLanguage = 'he'
defaultContentLanguageInSubdir = false

trailingSlash = true
canonifyURLs = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "ידע מדעי על תזונה, תוספים ובריאות — מידע מאוזן ומבוסס מחקר"
  description_en = "Nutritional pros and cons of various foods - Scientifically-based information for a healthy diet."
  keywords = ["תזונה", "בריאות", "ערכים תזונתיים", "יתרונות בריאותיים", "מזון בריא", "דיאטה", "פירות", "ירקות", "חלבון", "ויטמינים"]
  keywords_en = ["Nutrition", "Health", "Nutritional Values", "Health Benefits", "Healthy Food", "Diet", "Fruits", "Vegetables", "Protein", "Vitamins"]

  # A tag page listing fewer than this many articles (regular pages only;
  # section hubs tagged in _index.md do not count) carries no information the
  # articles themselves don't. 120 of 206 tag pages listed a single article, all
  # sharing one boilerplate description. Those are noindexed and kept out of the
  # sitemap; see layouts/sitemap.xml and layouts/partials/head.html.
  min_term_pages = 5

# Only `tags` is used in front matter. Left at Hugo's defaults, `categories`
# also produced an indexable, permanently empty /categories/ page.
[taxonomies]
  tag = "tags"

[languages]
  [languages.he]
    weight = 1
    languageCode = 'he'
    languageName = 'עברית'
    languageDirection = 'rtl'
    title = 'מדע בתנועה'
    [languages.he.params]
      locale = 'he_IL'
      inLanguage = 'he-IL'
      dateFormat = '02.01.2006'
  [languages.en]
    weight = 2
    languageCode = 'en'
    languageName = 'English'
    languageDirection = 'ltr'
    title = 'Wise Plate'
    [languages.en.params]
      locale = 'en_US'
      inLanguage = 'en'
      dateFormat = 'January 2, 2006'

# English has no section or tag pages: with only a handful of translated
# articles they would be near-empty hubs, and translated articles carry no
# tags. (disableKinds is site-wide, so it cannot do this per language.) The
# English home, /en/, lists every English article (layouts/index.en.html).
[[cascade]]
  [cascade.build]
    render = 'never'
  [cascade.target]
    lang = 'en'
    kind = '{section,taxonomy,term}'

# Hugo turns on its built-in link and image render hooks for multilingual
# sites, which rewrites every in-page "#anchor" link into an absolute URL.
# Keep the links exactly as written.
[markup.goldmark.renderHooks.image]
  enableDefault = false
[markup.goldmark.renderHooks.link]
  enableDefault = false
